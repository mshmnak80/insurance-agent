[project]
name = "insurance-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M A", email = "mshmnak80@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pgvector>=0.5.1",
    "psycopg2-binary>=2.9.13",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "rapidocr-onnxruntime>=1.4.4",
]

[project.scripts]
insurance-agent = "insurance_agent:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
